name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Train the model
        run: python api/lmp_service.py
      - name: API tests
        run: python -m pytest -q api/tests
      - name: Browser model matches the Python model
        run: python web/export_model.py && node web/test.js
      - name: Build the web app
        run: python frontend/build.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the image
        run: |
          docker build -t lmp-checker .
          docker run -d -p 7860:7860 --name lmp lmp-checker
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 2; done
          curl -sf -X POST localhost:7860/api/score -H 'Content-Type: application/json' \
            -d '{"original":"The tenant shall not keep pets.","simplification":"The tenant can keep pets."}'
